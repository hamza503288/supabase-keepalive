name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install supawake
        run: npm install -g supawake

      - name: Configure and Ping Supabase
        run: |
          cat <<EOF > /tmp/supawake.json
          {
            "projects": [
              {
                "name": "mon-projet",
                "url": "${{ secrets.SUPABASE_URL }}",
                "anonKey": "${{ secrets.SUPABASE_ANON_KEY }}",
                "table": "keepalive"
              }
            ]
          }
          EOF
          supawake ping --config /tmp/supawake.json
